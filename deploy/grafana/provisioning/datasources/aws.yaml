apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    isDefault: true
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION:-us-east-1}
    editable: true

  - name: X-Ray
    type: grafana-x-ray-datasource
    access: proxy
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION:-us-east-1}
    editable: true
