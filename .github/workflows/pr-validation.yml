name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Go 测试 ──────────────────────────────────────────────
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
      - run: go test ./... -v -race

  # ── Infra 文件守卫 ───────────────────────────────────────
  infra-file-guard:
    runs-on: ubuntu-latest
    outputs:
      has_infra_changes: ${{ steps.guard.outputs.has_infra_changes }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - id: guard
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -q "^iac/infra/"; then
            if [[ "$HEAD_REF" != "iac/infra/dev" ]]; then
              echo "::error::iac/infra/ changes must go through iac/infra/dev branch first"
              exit 1
            fi
            echo "has_infra_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_infra_changes=false" >> "$GITHUB_OUTPUT"
          fi

  # ── CDK Diff (staging + prod 并行) ──────────────────────
  cdk-diff:
    needs: infra-file-guard
    if: needs.infra-file-guard.outputs.has_infra_changes == 'true'
    runs-on:
      - codebuild-aws-devops-demo-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      matrix:
        include:
          - env_name: staging
            role_secret: STAGING_ROLE_ARN
            account_var: STAGING_ACCOUNT_ID
            region_var: STAGING_REGION
          - env_name: prod
            role_secret: PROD_ROLE_ARN
            account_var: PROD_ACCOUNT_ID
            region_var: PROD_REGION
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iac/infra/package-lock.json
      - run: cd iac/infra && npm ci && npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets[matrix.role_secret] }}
          aws-region: ${{ vars[matrix.region_var] }}
      - env:
          ENV_NAME: ${{ matrix.env_name }}
          ACCOUNT_ID: ${{ vars[matrix.account_var] }}
          REGION: ${{ vars[matrix.region_var] }}
        run: |
          echo "## $ENV_NAME — Infra" > /tmp/diff.txt
          (cd iac/infra && npx cdk diff --all --quiet \
            -c "env=$ENV_NAME" \
            -c "account=$ACCOUNT_ID" \
            -c "region=$REGION" \
            --no-color 2>&1 || true) >> /tmp/diff.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cdk-diff-${{ matrix.env_name }}
          path: /tmp/diff.txt

  # ── 发布 PR 评论 ─────────────────────────────────────────
  post-diff-comment:
    needs: cdk-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.3
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = '';
            for (const env of ['staging', 'prod']) {
              try {
                body += fs.readFileSync(`cdk-diff-${env}/diff.txt`, 'utf8') + '\n';
              } catch {}
            }
            if (!body.trim()) return;
            const marker = '<!-- cdk-diff -->';
            body = marker + '\n```\n' + body + '```';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body?.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }
