name: Service Release

on:
  push:
    tags: ['cmd/*/v*']

permissions:
  contents: read
  id-token: write

jobs:
  # ── 解析 tag ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      svc_name: ${{ steps.parse.outputs.svc_name }}
      image_tag: ${{ steps.parse.outputs.image_tag }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SVC_NAME="${TAG#cmd/}"
          SVC_NAME="${SVC_NAME%%/v*}"
          IMAGE_TAG="${TAG##*/}"
          echo "Releasing $SVC_NAME $IMAGE_TAG"
          echo "svc_name=$SVC_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── Docker Build & Push ──────────────────────────────────
  build-push:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
          aws-region: ${{ vars.DEV_REGION }}
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Ensure ECR repo
        env:
          SVC: ${{ needs.prepare.outputs.svc_name }}
          REGION: ${{ vars.DEV_REGION }}
        run: |
          aws ecr create-repository --repository-name "awsdemo/$SVC" \
            --image-scanning-configuration scanOnPush=true --region "$REGION" 2>/dev/null || true
      - uses: docker/build-push-action@v7
        with:
          push: true
          file: deploy/${{ needs.prepare.outputs.svc_name }}.Dockerfile
          tags: ${{ steps.ecr-login.outputs.registry }}/awsdemo/${{ needs.prepare.outputs.svc_name }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/awsdemo/${{ needs.prepare.outputs.svc_name }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/awsdemo/${{ needs.prepare.outputs.svc_name }}:cache,mode=max

  # ── Staging ──────────────────────────────────────────────
  staging-diff:
    needs: [prepare, build-push]
    runs-on: ubuntu-latest
    outputs:
      has_diff: ${{ steps.diff.outputs.has_diff }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iac/service/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STAGING_ROLE_ARN }}
          aws-region: ${{ vars.STAGING_REGION }}
      - run: cd iac/service && npm ci && npm run build
      - id: diff
        env:
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          ACCOUNT_ID: ${{ vars.STAGING_ACCOUNT_ID }}
          REGION: ${{ vars.STAGING_REGION }}
        run: |
          cd iac/service
          if npx cdk diff "awsdemo-staging-$SVC" --exclusively \
            -c env=staging -c "tag:$SVC=$TAG" \
            -c "account=$ACCOUNT_ID" -c "region=$REGION" \
            --quiet --fail --no-color > /tmp/diff.txt 2>&1; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            cat /tmp/diff.txt
            echo "### CDK Diff — $SVC (staging)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/diff.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify WeCom
        if: steps.diff.outputs.has_diff == 'true'
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -z "$WEBHOOK" ]] && exit 0
          BODY=$(jq -n --arg svc "$SVC" --arg tag "$TAG" --arg url "$RUN_URL" \
            '{msgtype:"markdown",markdown:{content:("📋 **" + $svc + "** staging 待部署\n> Tag: `" + $tag + "`\n\n👉 [查看 Diff & 审批](" + $url + ")")}}')
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$BODY"

  staging-deploy:
    needs: [prepare, staging-diff]
    if: needs.staging-diff.outputs.has_diff == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iac/service/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STAGING_ROLE_ARN }}
          aws-region: ${{ vars.STAGING_REGION }}
      - env:
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          ACCOUNT_ID: ${{ vars.STAGING_ACCOUNT_ID }}
          REGION: ${{ vars.STAGING_REGION }}
        run: |
          cd iac/service && npm ci && npm run build
          npx cdk deploy "awsdemo-staging-$SVC" --exclusively \
            -c env=staging -c "tag:$SVC=$TAG" \
            -c "account=$ACCOUNT_ID" -c "region=$REGION" \
            --require-approval never

      - name: Notify WeCom
        if: always()
        env:
          STATUS: ${{ job.status }}
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          [[ -z "$WEBHOOK" ]] && exit 0
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          BODY=$(jq -n --arg e "$EMOJI" --arg s "$STATUS" --arg svc "$SVC" --arg tag "$TAG" \
            '{msgtype:"markdown",markdown:{content:($e + " **" + $s + "** " + $svc + " " + $tag + " staging deployed")}}')
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$BODY"

  # ── Prod ─────────────────────────────────────────────────
  prod-diff:
    needs: [prepare, staging-diff, staging-deploy]
    if: always() && (needs.staging-deploy.result == 'success' || needs.staging-diff.outputs.has_diff == 'false')
    runs-on: ubuntu-latest
    outputs:
      has_diff: ${{ steps.diff.outputs.has_diff }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iac/service/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_ROLE_ARN }}
          aws-region: ${{ vars.PROD_REGION }}
      - run: cd iac/service && npm ci && npm run build
      - id: diff
        env:
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          ACCOUNT_ID: ${{ vars.PROD_ACCOUNT_ID }}
          REGION: ${{ vars.PROD_REGION }}
        run: |
          cd iac/service
          if npx cdk diff "awsdemo-prod-$SVC" --exclusively \
            -c env=prod -c "tag:$SVC=$TAG" \
            -c "account=$ACCOUNT_ID" -c "region=$REGION" \
            --quiet --fail --no-color > /tmp/diff.txt 2>&1; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            cat /tmp/diff.txt
            echo "### CDK Diff — $SVC (prod)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/diff.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify WeCom
        if: steps.diff.outputs.has_diff == 'true'
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -z "$WEBHOOK" ]] && exit 0
          BODY=$(jq -n --arg svc "$SVC" --arg tag "$TAG" --arg url "$RUN_URL" \
            '{msgtype:"markdown",markdown:{content:("📋 **" + $svc + "** PROD 待部署\n> Tag: `" + $tag + "`\n\n👉 [查看 Diff & 审批](" + $url + ")")}}')
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$BODY"

  prod-deploy:
    needs: [prepare, prod-diff]
    if: needs.prod-diff.outputs.has_diff == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iac/service/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_ROLE_ARN }}
          aws-region: ${{ vars.PROD_REGION }}
      - env:
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          ACCOUNT_ID: ${{ vars.PROD_ACCOUNT_ID }}
          REGION: ${{ vars.PROD_REGION }}
        run: |
          cd iac/service && npm ci && npm run build
          npx cdk deploy "awsdemo-prod-$SVC" --exclusively \
            -c env=prod -c "tag:$SVC=$TAG" \
            -c "account=$ACCOUNT_ID" -c "region=$REGION" \
            --require-approval never

      - name: Notify WeCom
        if: always()
        env:
          STATUS: ${{ job.status }}
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          SVC: ${{ needs.prepare.outputs.svc_name }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          [[ -z "$WEBHOOK" ]] && exit 0
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          BODY=$(jq -n --arg e "$EMOJI" --arg s "$STATUS" --arg svc "$SVC" --arg tag "$TAG" \
            '{msgtype:"markdown",markdown:{content:($e + " **" + $s + "** " + $svc + " " + $tag + " PRODUCTION deployed")}}')
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$BODY"
